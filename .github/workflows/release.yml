# Build once against glibc 2.28, then run the same archive on older and newer hosts.
# Push v1.0.0, or select an existing tag with Actions -> Release -> Run workflow.
# Successful runs create/update a draft; publishing remains a manual GitHub action.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag matching the project version (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # AlmaLinux 8 / glibc 2.28; pin the image as well as Python and uv.
  BUILD_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
  PYTHON_VERSION: "3.12.14"
  UV_VERSION: "0.12.12"
  UV_SHA256: ab9b309d4586403f024e100abaceb396616e178a553e2500c36087d180f09509

jobs:
  build:
    name: Build Linux x86_64 (glibc 2.28)
    # Limit both initial runs and reruns to the owner of this personal repository.
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      asset: ${{ steps.metadata.outputs.asset }}
    steps:
      - name: Validate the tag name
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag: vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi

      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check version consistency
        id: metadata
        run: |
          python3 - <<'PY'
          import os
          import runpy
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          runtime_version = runpy.run_path("src/ish/__init__.py")["__version__"]
          if os.environ["RELEASE_TAG"] != "v" + version or runtime_version != version:
              raise SystemExit("The tag, pyproject.toml, and ish.__version__ must agree.")
          if Path(".python-version").read_text().strip() != os.environ["PYTHON_VERSION"]:
              raise SystemExit("Update the workflow's Python version to match .python-version.")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ncommit={commit}\n")
              output.write(f"asset=ish-{version}-linux-x86_64\n")
          PY

      - name: Compile and check every bundled ELF file
        env:
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          docker run --rm -i --platform linux/amd64 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work \
            --env PYTHON_VERSION --env UV_VERSION --env UV_SHA256 \
            --env RELEASE_TAG --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env SOURCE_COMMIT --env BUILD_IMAGE \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            "$BUILD_IMAGE" bash -euo pipefail <<'BUILD'
          # Bind-mounted outputs must remain writable by the host runner.
          # Keep ownership consistent even when compilation or validation fails.
          restore_output_owner() {
            if [[ -d /work/dist ]]; then
              chown -hR "$BUILD_UID:$BUILD_GID" /work/dist
            fi
          }
          trap restore_output_owner EXIT

          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.28'
          curl --fail --location --retry 3 \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz" \
            --output /tmp/uv.tar.gz
          printf '%s  %s\n' "$UV_SHA256" /tmp/uv.tar.gz | sha256sum --check
          tar -xzf /tmp/uv.tar.gz -C /tmp
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          export UV_PYTHON="$PYTHON_VERSION" UV_PYTHON_PREFERENCE=only-managed
          export UV_PROJECT_ENVIRONMENT=/tmp/ish-build-venv
          export CFLAGS='-march=x86-64 -mtune=generic'
          export CXXFLAGS="$CFLAGS"
          uv python install "$PYTHON_VERSION"
          sh tools/build.sh --mode standalone --jobs 4 \
            --build-id "$RELEASE_TAG-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output-dir /work/dist/nuitka/ci

          /tmp/ish-build-venv/bin/python - <<'PY'
          import json
          import os
          import re
          import struct
          import subprocess
          from pathlib import Path

          root = Path("dist/nuitka/ci")
          bundle = root / "ish.dist"
          for name in ("ish", "libexec/ish_forward"):
              path = bundle / name
              if not path.is_file() or not os.access(path, os.X_OK):
                  raise SystemExit(f"Missing executable: {path}")
          requirements = {}
          for path in sorted(bundle.rglob("*")):
              if not path.is_file():
                  continue
              with path.open("rb") as stream:
                  header = stream.read(20)
              if not header.startswith(b"\x7fELF"):
                  continue
              if len(header) < 20 or header[4:6] != b"\x02\x01" or struct.unpack_from("<H", header, 18)[0] != 62:
                  raise SystemExit(f"Not a little-endian x86_64 ELF: {path}")
              info = subprocess.check_output(["readelf", "--version-info", "--wide", str(path)], text=True)
              # Definitions do not impose host requirements; inspect only imports.
              needs = info.partition("Version needs section")[2]
              versions = set(re.findall(r"Name: (GLIBC_[^\s]+)", needs))
              for version in versions:
                  if not re.fullmatch(r"GLIBC_[0-9]+(?:\.[0-9]+)+", version):
                      raise SystemExit(f"Unsupported glibc ABI requirement: {path}: {version}")
                  if tuple(map(int, version[6:].split("."))) > (2, 28):
                      raise SystemExit(f"glibc requirement exceeds 2.28: {path}: {version}")
              requirements[str(path.relative_to(bundle))] = sorted(versions)
          if not requirements:
              raise SystemExit("No ELF files were checked.")
          manifest = json.loads((root / "build.json").read_text())
          manifest.update(
              source_commit=os.environ["SOURCE_COMMIT"],
              release_tag=os.environ["RELEASE_TAG"],
              build_image=os.environ["BUILD_IMAGE"],
              target="linux-x86_64-glibc2.28",
              glibc_requirements=requirements,
          )
          (root / "build.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"Checked {len(requirements)} ELF files: x86_64, glibc <= 2.28")
          PY
          BUILD

      - name: Package the complete standalone distribution
        env:
          ASSET: ${{ steps.metadata.outputs.asset }}
        run: |
          stage="$RUNNER_TEMP/package/$ASSET"
          mkdir -p "$stage" dist/release
          cp -a dist/nuitka/ci/ish.dist "$stage/"
          cp dist/nuitka/ci/build.json README.md "$stage/"
          for license in LICENSE LICENSE.* COPYING COPYING.*; do
            if [[ -f "$license" ]]; then cp "$license" "$stage/"; fi
          done
          tar -czf "dist/release/$ASSET.tar.gz" -C "$RUNNER_TEMP/package" "$ASSET"
          cd dist/release
          sha256sum "$ASSET.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Save the candidate archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  smoke:
    name: Check archive on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["almalinux:8.10", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - name: Download the candidate archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: release

      - name: Check checksum and extract
        env:
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          tar -xzf "$ASSET.tar.gz"

      - name: Prepare a terminal smoke check
        run: |
          # Compatible with AlmaLinux 8's platform Python; it only drives the test.
          cat > "$RUNNER_TEMP/smoke.py" <<'PY'
          import errno
          import fcntl
          import os
          import pty
          import select
          import signal
          import struct
          import subprocess
          import sys
          import tempfile
          import termios
          import time
          from pathlib import Path

          binary, version = sys.argv[1:]
          with tempfile.TemporaryDirectory(prefix="ish-smoke-") as temporary:
              home = Path(temporary)
              (home / ".bashrc").write_text("PS1='ISH_CI> '\nPROMPT_COMMAND=\n")
              env = {"HOME": temporary, "PATH": "/usr/bin:/bin", "TERM": "xterm-256color", "LANG": "C.UTF-8"}
              # Fail if the frozen program falls back to host Python or a compiler.
              blocked = home / "blocked"
              blocked.mkdir()
              for name in ("python", "python3", "python3.12", "gcc", "cc"):
                  tool = blocked / name
                  tool.write_text('#!/bin/sh\necho "$0" >> "$HOME/forbidden-tools"\nexit 99\n')
                  tool.chmod(0o755)
              env["PATH"] = str(blocked) + ":" + env["PATH"]
              args = [binary, "--lang", "en", "--no-rc", "--no-plugins", "--home", str(home / "state")]
              result = subprocess.check_output(args + ["--version"], env=env, cwd=temporary, timeout=30)
              if result.decode().strip() != "ish " + version:
                  raise RuntimeError("Unexpected binary version: " + repr(result))
              for option in ("--help", "--diagnose"):
                  subprocess.run(args + [option, "/bin/bash"], env=env, cwd=temporary, check=True, timeout=30)

              pid, master = pty.fork()
              if pid == 0:
                  fcntl.ioctl(0, termios.TIOCSWINSZ, struct.pack("HHHH", 24, 100, 0, 0))
                  os.chdir(temporary)
                  os.execve(binary, args + ["/bin/bash"], env)
              reaped = False
              output = bytearray()
              try:
                  sent = False
                  deadline = time.monotonic() + 45
                  while time.monotonic() < deadline:
                      if select.select([master], [], [], 0.1)[0]:
                          try:
                              data = os.read(master, 65536)
                          except OSError as exc:
                              if exc.errno != errno.EIO:
                                  raise
                              data = b""
                          output.extend(data)
                          if b"\x1b[6n" in output:
                              os.write(master, b"\x1b[1;1R")
                              output = output.replace(b"\x1b[6n", b"")
                          # prompt-toolkit can style the final space separately.
                          if not sent and b"ISH_CI>" in output and b"\x1b[?2004h" in output:
                              os.write(master, b"printf 'ISH_%s\\n' OK > answer; exit 7\r")
                              sent = True
                      ended, status = os.waitpid(pid, os.WNOHANG)
                      if ended:
                          reaped = True
                          if not os.WIFEXITED(status) or os.WEXITSTATUS(status) != 7:
                              raise RuntimeError("Unexpected session exit: " + str(status))
                          break
                  else:
                      raise RuntimeError("Timed out waiting for the Bash session")
                  if (home / "answer").read_text() != "ISH_OK\n":
                      raise RuntimeError("The command did not execute correctly")
                  if list((home / "state" / ".cache").glob("session-*")):
                      raise RuntimeError("Session files survived normal exit")
                  if (home / "forbidden-tools").exists():
                      raise RuntimeError("The distribution invoked host Python or a compiler")
              except Exception:
                  print(output.decode("utf-8", "replace"), file=sys.stderr)
                  raise
              finally:
                  if not reaped:
                      os.kill(pid, signal.SIGKILL)
                      os.waitpid(pid, 0)
                  os.close(master)
          print("Version, CLI, Bash command, exit status, and session cleanup passed.")
          PY

      - name: Run outside the source tree and build environment
        env:
          IMAGE: ${{ matrix.image }}
          ASSET: ${{ needs.build.outputs.asset }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/release/$ASSET,target=/opt/ish,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/smoke.py,target=/smoke.py,readonly" \
            --env VERSION "$IMAGE" bash -euo pipefail -c '
              if [[ -x /usr/libexec/platform-python ]]; then
                driver=/usr/libexec/platform-python
              else
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
                driver=/usr/bin/python3
              fi
              cd /tmp
              "$driver" /smoke.py /opt/ish/ish.dist/ish "$VERSION"
            '

  release:
    name: Attach verified files to a draft release
    # Recheck here because this job can be rerun after an earlier successful build.
    if: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: release

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          remote_commit=$(gh api "repos/$GH_REPO/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
          if [[ "$remote_commit" != "$SOURCE_COMMIT" ]]; then
            echo 'The release tag changed after checkout; refusing to attach mismatched files.' >&2
            exit 1
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo 'This release is already published. Download the Actions artifact for review; published assets are not replaced.' >&2
              exit 1
            fi
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Linux x86_64 standalone distribution, built against glibc 2.28.

          Extract the archive and keep the entire `ish.dist` directory together.
          Run `./ish.dist/ish bash` from the extracted directory. The selected shell
          must be installed on the host. Native Windows and musl/Alpine are not covered.

          The same archive passed CLI and Bash session smoke checks on AlmaLinux 8.10,
          Ubuntu 22.04, and Ubuntu 24.04 containers. These checks use the GitHub runner's
          kernel and do not replace validation on the actual RHEL 8.10 host or of other shells.
          NOTES
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ish $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Drafts can be rebuilt; never overwrite assets of a published release.
          gh release upload "$RELEASE_TAG" "$ASSET.tar.gz" SHA256SUMS --clobber
          url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          printf 'Draft release: %s\nReview the assets, then publish it on GitHub.\n' "$url" >> "$GITHUB_STEP_SUMMARY"
