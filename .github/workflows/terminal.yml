name: Terminal checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native VT / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.12.12"
      UV_SHA256: ab9b309d4586403f024e100abaceb396616e178a553e2500c36087d180f09509
      UV_PYTHON_PREFERENCE: only-managed
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and native test programs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential curl xz-utils bash zsh tcsh vim ncurses-bin xvfb xclip util-linux libx11-6

      - name: Install the pinned package manager
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/uv.tar.gz"
          printf '%s  %s\n' "$UV_SHA256" "$RUNNER_TEMP/uv.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Install the locked project environment
        run: uv sync --locked --no-default-groups --group dev --python "$(cat .python-version)"

      - name: Build the checksum-pinned engine and private bridge
        run: uv run --no-sync python tools/build_ghostty_vt.py

      - name: Check lint and strict native VT regression
        run: uv run --no-sync python tools/check_terminal.py

      # Real Windows Terminal pixels and physical input require the separate
      # host matrix; this Linux runner never reports that coverage as passed.
